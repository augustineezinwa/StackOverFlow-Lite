swagger: '2.0'
info:
  description: API docs for StackOverFlow-Lite.
  version: 1.0.0
  title: StackOverFlow-Lite Web App API
  termsOfService: 'http://swagger.io/terms/'
  contact:
    email: augustineezinwa@gmail.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
host: stack-o-lite.netlify.app
basePath: /api/v1
tags:
  - name: Users
    description: API for user
  - name: Categories
    description: API for question categories (filter questions, create questions with category)
  - name: Questions
    description: API for questions
  - name: Answers
    description: API for answers
schemes:
  - https
  - http
paths:
  /auth/signup:
    post:
      tags:
        - Users
      summary: Add a new user
      description: Registers a new user into StackOverFlow-lite
      operationId: addUser
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: user
          description: A new user to register
          required: true
          schema:
            $ref: '#/definitions/UserSignUp'
      responses:
        '201':
          description: You signed up successfully
        '409':
          description: email is already in use.
        '422':
          description: Errors! Invalid parameters.
  /auth/login:
    post:
      tags:
        - Users
      summary: Login User
      description: Logins a registered user into StackOverFlow-Lite
      operationId: loginUser
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: user
          description: Logins a registered user
          required: true
          schema:
            $ref: '#/definitions/UserLogin'
      responses:
        '200':
          description: you are logged in.
        '401':
          description: password is incorrect.
        '404':
          description: email doesnt exist on the system. Login or signup
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      description: Returns all categories sorted by name. Use category names when filtering GET /questions (e.g. ?category=science) or set categoryId when creating a question.
      operationId: getAllCategories
      produces:
        - application/json
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/CategoriesListResponse'
  /questions:
    post:
      tags:
        - Questions
      summary: posts a question
      description: Creates a question in StackOverFlow-Lite
      operationId: createNewQuestion
      produces:
        - application/json
      parameters:
        - in: body
          name: question
          description: Creates a new question in StackOverFlow-Lite
          required: true
          schema:
            $ref: '#/definitions/PostQuestionModel'
        - in: query
          name: token
          description: you need a token to create this question
          required: true
          type: string
      responses:
        '201':
          description: you have successfully posted this question
        '400':
          description: 'Validation Errors!: Invalid input fields'
        '401':
          description: Unauthorized! Invalid token
        '403':
          description: 'No token!, Action forbidden! please sign up or login'
    get:
      tags:
        - Questions
      summary: Get all questions (with optional category filter and cursor pagination)
      description: Returns a paginated list of non-archived questions. Use category to filter by category name (e.g. science). Use limit and cursor for cursor-based pagination. Archived questions are excluded.
      operationId: getAllQuestions
      produces:
        - application/json
      parameters:
        - name: search
          in: query
          description: Search by keywords in title or description (when present, returns all matches; no pagination)
          required: false
          type: string
        - name: category
          in: query
          description: Filter questions by category name (e.g. science, technology). Ignored when search is set.
          required: false
          type: string
        - name: limit
          in: query
          description: Max number of questions to return (default 20, max 100). Used only when search is not set.
          required: false
          type: integer
          default: 20
        - name: cursor
          in: query
          description: Cursor for next page (use nextCursor from previous response). Used only when search is not set.
          required: false
          type: string
      responses:
        '200':
          description: success!
          schema:
            $ref: '#/definitions/QuestionsListResponse'
        '404':
          description: No questions found!
  '/questions/{questionId}':
    get:
      tags:
        - Questions
      summary: Gets a questions by id
      description: This gets a particular question with all its answers
      operationId: getAQuestionById
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: Id to fetch the question
          required: true
          type: integer
      responses:
        '200':
          description: success!
          schema:
            $ref: '#/definitions/QuestionFoundModel'
        '404':
          description: No question were found!
    delete:
      tags:
        - Questions
      summary: Delete a question by its id
      description: This can only be done by the logged in user.
      operationId: deleteQuestionById
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the question that needs to be deleted.
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to delete this question.
          required: true
          type: string
      responses:
        '200':
          description: You have successfully deleted this question.
        '401':
          description: 'Unauthorized, please provide a valid token'
        '404':
          description: This question does not exist.
  '/questions/{questionId}/archive':
    patch:
      tags:
        - Questions
      summary: Archive or unarchive a question
      description: Set the question's archived state. Only the question owner can archive or unarchive. Send body archived true to archive, false to unarchive. Archived questions are excluded from GET /questions and GET /users/questions.
      operationId: archiveQuestion
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          required: true
          type: integer
          description: The id of the question
        - name: token
          in: query
          required: true
          type: string
          description: Bearer token (must be question owner)
        - in: body
          name: body
          description: Set archived to true to archive, false to unarchive. Defaults to true if omitted.
          schema:
            $ref: '#/definitions/ArchiveQuestionRequest'
      responses:
        '200':
          description: Question archived or unarchived successfully
          schema:
            $ref: '#/definitions/ArchiveQuestionResponse'
        '403':
          description: You do not have permission to archive or unarchive this question
        '404':
          description: This question does not exist
  '/questions/{questionId}/pin':
    post:
      tags:
        - Questions
      summary: Pin a question
      description: Pins the question for the authenticated user. Idempotent (re-pinning returns existing pin). Use GET /users/questions/pinned to list pinned questions.
      operationId: pinQuestion
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          required: true
          type: integer
          description: The id of the question to pin
        - name: token
          in: query
          required: true
          type: string
          description: Bearer token
      responses:
        '201':
          description: Question pinned successfully
          schema:
            $ref: '#/definitions/PinQuestionResponse'
        '404':
          description: This question does not exist
  /users/questions/pinned:
    get:
      tags:
        - Questions
      summary: Get pinned questions
      description: Returns all questions pinned by the authenticated user. Only non-archived questions are included. Requires token.
      operationId: getPinnedQuestions
      produces:
        - application/json
      parameters:
        - name: token
          in: query
          required: true
          type: string
          description: Bearer token
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/UserQuestionsResponse'
        '401':
          description: Unauthorized
  /users/questions:
    get:
      tags:
        - Questions
      summary: Get questions for the authenticated user
      description: Returns non-archived questions asked by the logged-in user. Each question includes photoUrl (owner profile photo), imageUrl (question cover image), askedBy, and categoryId when set.
      operationId: getAUserQuestion
      produces:
        - application/json
      parameters:
        - name: token
          in: query
          description: you need a token to get these questions
          required: true
          type: string
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/UserQuestionsResponse'
        '404':
          description: No questions were found!
  /questions/:
    get:
      tags:
        - Questions
      summary: This searches for any question on Stack-Over-Flow-lite
      description: This searches for questions on Stack-Overflow-Lite
      operationId: SearchQuestion
      produces:
        - application/json
      parameters:
        - name: search
          in: query
          description: Enter in the keywords to search
          required: true
          type: string
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/AllQuestionFoundModel'
        '404':
          description: No questions were found!
  /questions/mostanswers:
    get:
      tags:
        - Questions
      summary: This displays questions with most answers
      description: This displays questions with most answers
      operationId: displayQuestionWithMostAnswers
      produces:
        - application/json
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/SearchQuestionModel'
        '404':
          description: No questions were found!
  '/questions/{questionId}/answers':
    post:
      tags:
        - Answers
      summary: This posts an answer to a question in StackOverFlow-Lite Application
      description: This route is available only to a logged in user
      operationId: postAnswer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: >-
            The id of the particular question that you want to post an answer
            to.
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to post this question
          required: true
          type: string
        - in: body
          name: Answer
          description: Enters an answer to a question
          required: true
          schema:
            $ref: '#/definitions/PostAnswerModel'
      responses:
        '200':
          description: success.
          schema:
            $ref: '#/definitions/PostAnswerModel'
        '400':
          description: Question validation errors!
        '401':
          description: Unauthorized! please provide a valid token
        '403':
          description: Access denied! please sign up or login
  '/questions/{questionId}/answers/{answerId}':
    put:
      tags:
        - Answers
      summary: Updates or prefer an answer on StackOverFlow-Lite
      description: >-
        This route is available only to the owner of the answer, or the owner of
        the question,.
      operationId: updatePreferAnswer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the particular question that bears the answer
          required: true
          type: integer
        - name: answerId
          in: path
          description: >-
            The id of the particular answer that needs to be updated or
            preffered.
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to prefer or update an answer.
          required: true
          type: string
        - name: Answer
          in: body
          description: Updates an answer
          required: true
          schema:
            $ref: '#/definitions/PostAnswerModel'
      responses:
        '200':
          description: success. you have successfully preffered or updated this answer.
        '400':
          description: invalid url
        '401':
          description: 'Unauthorized!, please provide a valid token.'
        '403':
          description: >-
            Action forbidden! you cannot edit this answer/  Action forbidden!
            you do not have access to this answer
        '404':
          description: >-
            This answer does not exist for this question/ This question does not
            exist
    get:
      tags:
        - Answers
      summary: This gets a particular answer with all its comments
      description: This route is available to everyone.
      operationId: getAnAnswer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the question that bears the answer
          required: true
          type: integer
        - name: answerId
          in: path
          description: The id of the answer that you need to fetch
          required: true
          type: integer
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/AnswerFoundModel'
        '404':
          description: answer not found!
    
  '/questions/{questionId}/answers/{answerId}/upvote':
    put:
      tags:
        - Answers
      summary: Upvotes an answer
      description: This route is available to every one in the application
      operationId: voteAnswer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the particular question that bears the answer
          required: true
          type: integer
        - name: answerId
          in: path
          description: The id of the particular answer that needs to be upvoted
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to upvote an answer.
          required: true
          type: string
      responses:
        '200':
          description: success. you have successfully upvoted this answer.
        '400':
          description: invalid url
        '401':
          description: 'Unauthorized!, please provide a valid token. '
        '403':
          description: >-
            Action forbidden! you cannot edit this answer Action forbidden! you
            do not have access to this answer
        '404':
          description: >-
            This answer does not exist for this question /This question does not
            exist.
  '/questions/{questionId}/answers/{answerId}/downvote':
    put:
      tags:
        - Answers
      summary: Downvotes an answer
      description: This route is available to everyone
      operationId: downvote answer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the particular question that bears the answer
          required: true
          type: integer
        - name: answerId
          in: path
          description: The id of the particular answer that needs to be downvoted
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to downvote this answer
          required: true
          type: string
      responses:
        '200':
          description: success. you have successfully downvoted this answer
        '400':
          description: invalid url
        '401':
          description: 'Unauthorized!, please provide a valid token.'
        '403':
          description: >-
            Action forbidden! you cannot edit this answer, Action forbidden! you
            do not have access to this answer
        '404':
          description: >-
            This answer does not exist for this question ,This question does not
            exist.
  '/questions/{questionId}/answers/{answerId}/comments':
    post:
      tags:
        - Answers
      summary: comments an answer
      description: This route is available to everyone
      operationId: commentAnswer
      produces:
        - application/json
      parameters:
        - name: questionId
          in: path
          description: The id of the particular question that bears the answer
          required: true
          type: integer
        - name: answerId
          in: path
          description: The id of the particular answer that you need
          required: true
          type: integer
        - name: token
          in: query
          description: you need a token to comment this answer
          required: true
          type: string
        - in: body
          name: addComment
          description: comment this answer
          required: true
          schema:
            $ref: '#/definitions/PostCommentModel'
      responses:
        '200':
          description: success. you have successfully commented this answer
        '400':
          description: invalid url
        '401':
          description: 'Unauthorized!, please provide a valid token.'
        '403':
          description: Action forbidden! you cannot comment this answer
        '404':
          description: >-
            This answer does not exist for this question ,This question does not
            exist.
definitions:
  UserSignUp:
    type: object
    required:
      - firstName
      - lastName
      - email
      - password
      - confrimpassword
    properties:
      firstName:
        type: string
        uniqueItems: false
      lastName:
        type: string
        uniqueItems: false
      email:
        type: string
        uniqueItems: true
      password:
        type: string
        uniqueItems: true
      confirmPassword:
        type: string
        uniqueItems: true
  UserLogin:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        uniqueItems: true
      password:
        type: string
        uniqueItems: true
  QuestionFoundModel:
    type: object
    required:
      - questionTitle
      - questionDescription
    properties:
      id:
        type: integer
        description: Question id
      questionTitle:
        type: string
      questionDescription:
        type: string
      photoUrl:
        type: string
        description: Profile photo URL of the question owner (from users table)
      imageUrl:
        type: string
        description: Cover image URL attached to the question
      askedBy:
        type: string
        description: Full name (first + last) of the user who asked the question
      categoryId:
        type: integer
        description: Category id when the question belongs to a category
      numberOfAnswer:
        type: string
      time:
        type: string
      date:
        type: string
      userId:
        type: integer
  QuestionListItem:
    type: object
    description: A question in list endpoints (GET /questions, GET /users/questions, GET /users/questions/pinned)
    properties:
      id:
        type: integer
      questionTitle:
        type: string
      questionDescription:
        type: string
      photoUrl:
        type: string
        description: Profile photo URL of the question owner (from users table)
      imageUrl:
        type: string
        description: Cover image URL attached to the question
      askedBy:
        type: string
        description: Full name of the user who asked the question
      userId:
        type: integer
      categoryId:
        type: integer
        description: Present when question has a category
      numberOfAnswers:
        type: integer
      upvotes:
        type: integer
      downvotes:
        type: integer
      time:
        type: string
      date:
        type: string
  ArchiveQuestionRequest:
    type: object
    description: Request body for PATCH /questions/{questionId}/archive
    properties:
      archived:
        type: boolean
        description: true to archive, false to unarchive. Defaults to true if body omitted.
    example:
      archived: false
  ArchiveQuestionResponse:
    type: object
    description: Response for PATCH /questions/{questionId}/archive
    properties:
      status:
        type: string
        example: success
      message:
        type: string
        example: Question unarchived successfully
      data:
        type: object
        properties:
          questionId:
            type: integer
          archived:
            type: boolean
            description: Current archived state after the update
  PinQuestionResponse:
    type: object
    description: Response for POST /questions/{questionId}/pin
    properties:
      status:
        type: string
        example: success
      message:
        type: string
        example: Question pinned successfully
      data:
        type: object
        properties:
          id:
            type: integer
            description: Pin record id
          questionId:
            type: integer
          userId:
            type: integer
  QuestionsListResponse:
    type: object
    description: Response for GET /questions (with cursor pagination)
    properties:
      status:
        type: string
        example: success
      data:
        type: object
        properties:
          questions:
            type: array
            items:
              $ref: '#/definitions/QuestionListItem'
          nextCursor:
            type: string
            description: Cursor for the next page; omit or null when no more pages
  UserQuestionsResponse:
    type: object
    description: Response for GET /users/questions
    properties:
      status:
        type: string
        example: success
      data:
        type: object
        properties:
          questions:
            type: array
            items:
              $ref: '#/definitions/QuestionListItem'
  CategoryItem:
    type: object
    description: A single category (id and name)
    properties:
      id:
        type: integer
        description: Category id (use when creating a question with categoryId)
      name:
        type: string
        description: Category name (use in GET /questions?category=name to filter)
    example:
      id: 1
      name: science
  CategoriesListResponse:
    type: object
    description: Response for GET /categories
    properties:
      status:
        type: string
        example: success
      data:
        type: object
        properties:
          categories:
            type: array
            items:
              $ref: '#/definitions/CategoryItem'
    example:
      status: success
      data:
        categories:
          - id: 1
            name: science
          - id: 2
            name: technology
  AnswerFoundModel:
    type: object
    required:
      - answer
    properties:
      answer:
        type: string
        uniqueItems: true
      comments:
        type: string
        uniqueItems: true
      time:
        type: string
        uniqueItems: true
      date:
        type: string
        uniqueItems: true
  PostQuestionModel:
    type: object
    properties:
      questionTitle:
        type: string
      questionDescription:
        type: string
      image_url:
        type: string
        description: Optional image URL attached to the question
      imageUrl:
        type: string
        description: Optional image URL (alternative to image_url)
      categoryId:
        type: integer
        description: Optional category id for the question
  AllQuestionFoundModel:
    type: object
    properties:
      status:
        type: string
        example: success
      data:
        type: object
        properties:
          questions:
            type: array
            items:
              $ref: '#/definitions/QuestionListItem'
          nextCursor:
            type: string
  SearchQuestionModel:
    type: object
    properties:
      status:
        type: string
        example: success
      data:
        type: object
        properties:
          questions:
            type: array
            items:
              $ref: '#/definitions/QuestionListItem'
  PostAnswerModel:
    type: object
    properties:
      answer:
        type: string
  PostCommentModel:
    type: object
    properties:
      comment:
        type: string
