[functions]
  node_bundler = "esbuild"

[functions.api]
  external_node_modules = ["swagger-ui-express"]

[build]
  command = "npm run build"
  publish = "client/public"
  functions = "build/netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/api/v1/:splat"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/docs"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/.netlify/functions/api/docs/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
